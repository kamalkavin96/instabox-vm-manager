# ==========================================
# Application Configuration
# ==========================================
spring.application.name=instabox-manager

# ==========================================
# PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/instabox_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ==========================================
# Jackson 3 Configuration
# ==========================================
spring.jackson.default-property-inclusion=non_null

# ==========================================
# Server Configuration
# ==========================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# ==========================================
# Instabox API Configuration
# ==========================================
instabox.api.base-url=https://api.instabox.sh/v1
instabox.api.timeout.connect=10s
instabox.api.timeout.read=30s

# ==========================================
# Application Security
# ==========================================
app.security.encryption-key=${APP_ENCRYPTION_KEY}

# ==========================================
# Logging Configuration
# ==========================================
logging.level.root=INFO
logging.level.com.kamalkavin96.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
